name: Release EndpointForge

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.0.0
        required: true
        type: string
      channel:
        description: Public release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - preview

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: powershell-gallery-${{ inputs.tag }}
  cancel-in-progress: false

env:
  POWERSHELLGET_VERSION: '2.2.5'
  PESTER_5_VERSION: '5.7.1'
  PESTER_6_VERSION: '6.0.1'
  PSSCRIPTANALYZER_VERSION: '1.25.0'

jobs:
  release:
    name: Verify, sign, publish, and announce
    runs-on: windows-2025
    timeout-minutes: 45
    environment: powershell-gallery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, version, channel, and reviewed lineage
        id: release_info
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag '$env:RELEASE_TAG' must use vMAJOR.MINOR.PATCH."
          }
          $manifest = Test-ModuleManifest .\EndpointForge.psd1 -ErrorAction Stop
          if ($env:RELEASE_TAG -cne "v$($manifest.Version)") {
            throw "Release tag '$env:RELEASE_TAG' does not match manifest version v$($manifest.Version)."
          }
          if ($manifest.Version.Major -ge 1 -and $env:RELEASE_CHANNEL -ne 'stable') {
            throw 'EndpointForge 1.x releases must use the stable channel.'
          }
          if ($manifest.Version.Major -lt 1 -and $env:RELEASE_CHANNEL -ne 'preview') {
            throw 'EndpointForge 0.x releases must use the preview channel.'
          }
          if ($manifest.Version.Major -ge 1) {
            .\build\Test-ManagedCertificationEvidence.ps1 -ModuleVersion $manifest.Version.ToString()
          }

          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch origin/main.' }
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ([string]::IsNullOrWhiteSpace($tagCommit)) { throw 'The release tag has no commit.' }
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tagged commit '$tagCommit' is not reachable from reviewed origin/main."
          }

          "version=$($manifest.Version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag_commit=$tagCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install pinned release tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PowerShellGet -RequiredVersion $env:POWERSHELLGET_VERSION -Scope CurrentUser -Force -AllowClobber
          Import-Module PowerShellGet -RequiredVersion $env:POWERSHELLGET_VERSION -Force

          $toolRoot = Join-Path $env:RUNNER_TEMP 'EndpointForgeModules'
          $pester5Root = Join-Path $toolRoot 'Pester5'
          $pester6Root = Join-Path $toolRoot 'Pester6'
          $analyzerRoot = Join-Path $toolRoot 'Analyzer'
          $null = New-Item -ItemType Directory -Path $pester5Root,$pester6Root,$analyzerRoot -Force
          Save-Module Pester -RequiredVersion $env:PESTER_5_VERSION -Path $pester5Root -Repository PSGallery
          Save-Module Pester -RequiredVersion $env:PESTER_6_VERSION -Path $pester6Root -Repository PSGallery
          Save-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Path $analyzerRoot -Repository PSGallery
          $env:PSModulePath = "$analyzerRoot;$env:PSModulePath"
          "PSModulePath=$env:PSModulePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $powerShellGet = Get-Module PowerShellGet | Where-Object Version -eq ([version]$env:POWERSHELLGET_VERSION)
          $pester5 = Test-ModuleManifest (Join-Path $pester5Root "Pester\$env:PESTER_5_VERSION\Pester.psd1") -ErrorAction Stop
          $pester6 = Test-ModuleManifest (Join-Path $pester6Root "Pester\$env:PESTER_6_VERSION\Pester.psd1") -ErrorAction Stop
          $analyzer = Test-ModuleManifest (Join-Path $analyzerRoot "PSScriptAnalyzer\$env:PSSCRIPTANALYZER_VERSION\PSScriptAnalyzer.psd1") -ErrorAction Stop
          if ($null -eq $powerShellGet -or
              $pester5.Version -ne [version]$env:PESTER_5_VERSION -or
              $pester6.Version -ne [version]$env:PESTER_6_VERSION -or
              $analyzer.Version -ne [version]$env:PSSCRIPTANALYZER_VERSION) {
            throw 'The resolved release-tool versions do not match the pinned versions.'
          }

      - name: Test with Windows PowerShell 5.1
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $env:PSModulePath = "$(Join-Path $env:RUNNER_TEMP 'EndpointForgeModules\Pester5');$env:PSModulePath"
          $null = New-Item -ItemType Directory -Path .\TestResults -Force
          .\build\Test-Module.ps1 -RequireScriptAnalyzer
          .\build\Test-PublicContract.ps1
          .\build\Test-ReleaseMetadata.ps1 -ExpectedTag $env:RELEASE_TAG -RequireCleanWorktree
          .\build\Invoke-PesterTests.ps1 -RequiredVersion $env:PESTER_5_VERSION `
            -TestResultPath .\TestResults\pester-release-5.1.xml
          .\build\Test-WindowsRuntime.ps1

      - name: Test with PowerShell 7
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Join-Path $env:RUNNER_TEMP 'EndpointForgeModules\Pester6');$env:PSModulePath"
          .\build\Test-Module.ps1 -RequireScriptAnalyzer
          .\build\Test-PublicContract.ps1
          .\build\Invoke-PesterTests.ps1 -RequiredVersion $env:PESTER_6_VERSION `
            -TestResultPath .\TestResults\pester-release-7.xml `
            -CodeCoverage -CodeCoverageResultPath .\TestResults\coverage-release.xml `
            -MinimumCoveragePercent 60
          .\build\Test-WindowsRuntime.ps1

      - name: Build staged module
        shell: powershell
        run: .\build\Build-Module.ps1 -SkipTests

      - name: Import publisher certificate and sign staged module
        id: signing
        shell: powershell
        env:
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
          CERTIFICATE_BASE64: ${{ secrets.CODESIGN_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
          CERTIFICATE_THUMBPRINT: ${{ secrets.CODESIGN_CERTIFICATE_THUMBPRINT }}
          TIMESTAMP_SERVER: ${{ secrets.CODESIGN_TIMESTAMP_SERVER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $requiresSignature = ([version]$env:RELEASE_VERSION).Major -ge 1
          $signingValues = @(
            $env:CERTIFICATE_BASE64,
            $env:CERTIFICATE_PASSWORD,
            $env:CERTIFICATE_THUMBPRINT,
            $env:TIMESTAMP_SERVER
          )
          $configuredSigningValues = @($signingValues | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($configuredSigningValues -notin @(0, 4)) {
            throw 'All four code-signing secrets must be configured together.'
          }
          if ($configuredSigningValues -eq 0) {
            if ($requiresSignature) {
              throw 'EndpointForge 1.x requires the protected code-signing certificate secrets.'
            }
            'signed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Warning 'This preview release is unsigned. Stable 1.x publication will not permit this.'
            exit 0
          }

          if ($env:CERTIFICATE_THUMBPRINT -notmatch '^[A-Fa-f0-9]{40}$') {
            throw 'CODESIGN_CERTIFICATE_THUMBPRINT must contain exactly 40 hexadecimal characters.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'EndpointForgePublisher.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $securePassword = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My `
            -Password $securePassword -Exportable:$false -ErrorAction Stop
          if ($certificate.Thumbprint -ine $env:CERTIFICATE_THUMBPRINT) {
            throw 'The imported certificate does not match CODESIGN_CERTIFICATE_THUMBPRINT.'
          }
          .\build\Protect-StagedModule.ps1 -ModulePath .\artifacts\EndpointForge `
            -CertificateThumbprint $certificate.Thumbprint -CertificateStoreLocation CurrentUser `
            -TimestampServer $env:TIMESTAMP_SERVER -Confirm:$false
          "certificate_path=$($certificate.PSPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pfx_path=$pfxPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          'signed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify staged package, signer, and inventory
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          WAS_SIGNED: ${{ steps.signing.outputs.signed }}
          EXPECTED_SIGNER: ${{ secrets.CODESIGN_CERTIFICATE_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\build\Test-StagedModule.ps1 -ModulePath .\artifacts\EndpointForge
          if ($env:WAS_SIGNED -eq 'true') {
            .\build\Test-PublishReadiness.ps1 -ModulePath .\artifacts\EndpointForge `
              -RequireSignature -ExpectedSignerThumbprint $env:EXPECTED_SIGNER
          }
          else {
            .\build\Test-PublishReadiness.ps1 -ModulePath .\artifacts\EndpointForge
          }
          $stagedManifest = Test-ModuleManifest .\artifacts\EndpointForge\EndpointForge.psd1 -ErrorAction Stop
          if ($env:RELEASE_TAG -cne "v$($stagedManifest.Version)") {
            throw 'The staged module version does not match the release tag.'
          }

      - name: Create release archive
        id: archive
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          .\build\New-ReleaseSbom.ps1 -ModulePath .\artifacts\EndpointForge `
            -OutputPath .\artifacts\EndpointForge.cdx.json
          $archivePath = ".\artifacts\EndpointForge-$($env:RELEASE_TAG).zip"
          Compress-Archive -LiteralPath .\artifacts\EndpointForge -DestinationPath $archivePath -CompressionLevel Optimal
          "path=$archivePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Attest release archive and checksum inventory
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            artifacts/EndpointForge-${{ inputs.tag }}.zip
            artifacts/EndpointForge.sha256.json
            artifacts/EndpointForge.cdx.json

      - name: Upload verified release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EndpointForge-${{ inputs.tag }}
          path: |
            artifacts/EndpointForge-${{ inputs.tag }}.zip
            artifacts/EndpointForge.sha256.json
            artifacts/EndpointForge.cdx.json
            TestResults/*.xml
          if-no-files-found: error
          retention-days: 90

      - name: Publish tested module to PowerShell Gallery
        shell: powershell
        env:
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
            throw 'PSGALLERY_API_KEY is not configured.'
          }
          Import-Module PowerShellGet -RequiredVersion $env:POWERSHELLGET_VERSION -Force
          $existing = Find-Module EndpointForge -RequiredVersion $env:RELEASE_VERSION -Repository PSGallery -ErrorAction SilentlyContinue
          if ($null -ne $existing) {
            Write-Output "EndpointForge $env:RELEASE_VERSION is already present in the Gallery; continuing with verification."
            exit 0
          }
          $publishCommand = Get-Command Publish-Module -Module PowerShellGet -ErrorAction Stop
          if ($publishCommand.Version -ne [version]$env:POWERSHELLGET_VERSION) {
            throw "Publish-Module must come from PowerShellGet $($env:POWERSHELLGET_VERSION)."
          }
          Publish-Module -Path .\artifacts\EndpointForge -NuGetApiKey $env:PSGALLERY_API_KEY `
            -Repository PSGallery -ErrorAction Stop

      - name: Verify clean Gallery installation
        shell: powershell
        env:
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
          WAS_SIGNED: ${{ steps.signing.outputs.signed }}
          EXPECTED_SIGNER: ${{ secrets.CODESIGN_CERTIFICATE_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PowerShellGet -RequiredVersion $env:POWERSHELLGET_VERSION -Force
          $published = $null
          foreach ($attempt in 1..20) {
            $published = Find-Module EndpointForge -RequiredVersion $env:RELEASE_VERSION `
              -Repository PSGallery -ErrorAction SilentlyContinue
            if ($null -ne $published) { break }
            Start-Sleep -Seconds 15
          }
          if ($null -eq $published) {
            throw "EndpointForge $env:RELEASE_VERSION did not become available in the Gallery."
          }

          $installRoot = Join-Path $env:RUNNER_TEMP 'EndpointForgeCleanInstall'
          [void](New-Item -ItemType Directory -Path $installRoot -Force)
          Save-Module EndpointForge -RequiredVersion $env:RELEASE_VERSION -Repository PSGallery -Path $installRoot
          $installedManifest = Join-Path $installRoot "EndpointForge\$env:RELEASE_VERSION\EndpointForge.psd1"
          $installedModulePath = Split-Path -Parent $installedManifest
          $installed = Test-ModuleManifest $installedManifest -ErrorAction Stop
          if ($installed.Version -ne [version]$env:RELEASE_VERSION -or $installed.ExportedFunctions.Count -ne 22) {
            throw 'The clean Gallery package did not expose the expected version and 22-command contract.'
          }

          # PowerShellGet adds this hidden client-side cache file after extracting the
          # Gallery package. It is not part of the published module and must not weaken
          # the exact package file-set and SHA-256 comparison.
          $powerShellGetMetadata = Join-Path $installedModulePath 'PSGetModuleInfo.xml'
          if (Test-Path -LiteralPath $powerShellGetMetadata -PathType Leaf) {
            $metadataItem = Get-Item -LiteralPath $powerShellGetMetadata -Force
            if (($metadataItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $metadataItem.Length -gt 1MB) {
              throw 'PowerShellGet produced an unsafe local metadata file.'
            }
            Remove-Item -LiteralPath $powerShellGetMetadata -Force
          }

          .\build\Test-StagedModule.ps1 -ModulePath $installedModulePath `
            -HashInventoryPath .\artifacts\EndpointForge.sha256.json
          if ($env:WAS_SIGNED -eq 'true') {
            .\build\Test-PublishReadiness.ps1 -ModulePath $installedModulePath `
              -RequireSignature -ExpectedSignerThumbprint $env:EXPECTED_SIGNER
          }
          .\build\Test-WindowsRuntime.ps1 -ModulePath $installedManifest

      - name: Create or update draft GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          $ErrorActionPreference = 'Stop'
          $previousErrorActionPreference = $ErrorActionPreference
          try {
            # A missing release is an expected branch on the first run. Windows
            # PowerShell can promote native stderr to an ErrorRecord, so probe it
            # without allowing the expected 404 to terminate this step.
            $ErrorActionPreference = 'SilentlyContinue'
            gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
            $releaseExists = $LASTEXITCODE -eq 0
          }
          finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }

          if (-not $releaseExists) {
            $arguments = @(
              'release', 'create', $env:RELEASE_TAG,
              '--repo', $env:GITHUB_REPOSITORY,
              '--verify-tag',
              '--draft',
              '--generate-notes',
              '--title', "EndpointForge $env:RELEASE_TAG"
            )
            if ($env:RELEASE_CHANNEL -eq 'preview') { $arguments += '--prerelease' }
            gh @arguments
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft GitHub release.' }
          }
          gh release upload $env:RELEASE_TAG `
            ".\artifacts\EndpointForge-$env:RELEASE_TAG.zip" `
            .\artifacts\EndpointForge.sha256.json `
            .\artifacts\EndpointForge.cdx.json `
            --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not attach the release evidence.' }

      - name: Publish the verified GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          $arguments = @(
            'release', 'edit', $env:RELEASE_TAG,
            '--repo', $env:GITHUB_REPOSITORY,
            '--draft=false'
          )
          if ($env:RELEASE_CHANNEL -eq 'preview') {
            $arguments += @('--prerelease', '--latest=false')
          }
          else {
            $arguments += @('--prerelease=false', '--latest')
          }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'The verified GitHub release could not be made public.' }

      - name: Remove temporary publisher certificate
        if: always()
        shell: powershell
        env:
          CERTIFICATE_PATH: ${{ steps.signing.outputs.certificate_path }}
          PFX_PATH: ${{ steps.signing.outputs.pfx_path }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PATH)) {
            Remove-Item -LiteralPath $env:CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue
          }
          if (-not [string]::IsNullOrWhiteSpace($env:PFX_PATH) -and
              (Test-Path -LiteralPath $env:PFX_PATH -PathType Leaf)) {
            Remove-Item -LiteralPath $env:PFX_PATH -Force -ErrorAction SilentlyContinue
          }
